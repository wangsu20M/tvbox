name: Update TVBox sources

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-sources.yml"
      - "config/**"
      - "tests/**"
      - "tvbox_aggregator.py"
  schedule:
    - cron: "23 19 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check and rank sources
        run: python tvbox_aggregator.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Publish updated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json public/
          git diff --cached --quiet || git commit -m "chore: update source health"
          git push
